        - K_Shasti
        - K_Saptami
        - K_Ashtami
        - K_Navami
        - K_Dashami
        - K_Ekadashi
        - K_Dwadashi
        - K_Thrayodashi
        - K_Chaturdashi
        - Amavasya
    AstroConstants.Weekdays:
      type: string
      enum:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
    AstroMetadata:
      type: object
      properties:
        uid:
          description: UUID for the object
          type: string
        name:
          description: name of the object
          type: string
        owner:
          description: owner UUID of the object (user UUID)
          type: string
        tenancy:
          description: tenant UUID of the object
          type: string
        parentUid:
          description: parent uuid
          type: string
        type:
          $ref: '#/components/schemas/AstroMetas.AstroTypes'
          description: type of the astro object
        tags:
          type: array
          items:
            $ref: '#/components/schemas/AstroMetas.MetaTags'
            description: tags to identify/describe the object
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AstroMetadata.AnnotationsEntry:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    AstroMetadata.LabelsEntry:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    AstroMetas:
      type: object
    AstroMetas.AstroTypes:
      type: string
      enum:
        - Ignore_astro_type
        - Planet
        - Rasi
        - Planet_chaaya
        - Star
        - Special_star
    AstroMetas.MetaTags:
      type: string
      enum:
