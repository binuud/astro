        - Element_fire
        - Element_water
        - Element_earth
        - Quality_fixed
        - Quality_moveable
        - Quality_mutable
        - Quality_cardinal
        - Padding_18
        - Padding_19
        - State_common
        - State_lame
        - Blind_day
        - Blind_night
        - Deaf_morning
        - Deaf_midday
        - Deaf_night
        - Padding_27
        - Padding_28
        - Padding_29
        - Tithi_nanda
        - Tithi_bhadra
        - Tithi_jaya
        - Tithi_riktha
        - Tithi_poorna
        - Tridosha_vaatha
        - Tridosha_pitha
        - Tridosha_kapha
        - Padding_38
        - Padding_39
        - Bhava_trikona
        - Bhava_kendra
        - Bhava_upachaya
        - Bhava_dusthana
        - Bhava_trishadayas
        - Bhava_marakasthana
        - Padding_46
        - Padding_47
        - Padding_48
        - Padding_49
        - Rasi_exalted
        - Rasi_moolatrikona
        - Rasi_deblited
    AstroMetas.Nature:
      type: string
      enum:
        - IgnoreNature
        - Benefic
        - Malefic
        - Choosy
        - Both
        - Avoid
    AstroMetas.PanchangTags:
      type: string
      enum:
        - Ignore_panchangTag
        - KrishnaPaksha
        - ShuklaPaksha
        - Amavasya
        - Poornima
        - SankataharaChaturti
        - Shasti
        - Ekadasi
        - AkshayaTritiya
        - Krithika
        - Pradosham
        - Sivaratri
        - Mahasivaratri
        - MarriageMuhurta
    AstroObject:
      $ref: '#/components/schemas/DashaItem'
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        birthData:
          $ref: '#/components/schemas/BirthData'
        planets:
          $ref: '#/components/schemas/Planets'
        dashas:
          type: array
          items:
            $ref: '#/components/schemas/DashaItem'
    BirthData:
      type: object
      properties:
        tob:
          $ref: '#/components/schemas/TobData'
          description: Date of birth
        pob:
          $ref: '#/components/schemas/PobData'
          description: Place of Birth
    CitiesGetResponse:
      type: object
      properties:
        details:
          $ref: '#/components/schemas/CityInfo'
    CitiesSearchResponse:
      type: object
      properties:
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CityInfo'
    CityInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stateId:
          type: integer
          format: int64
        stateCode:
          type: string
        stateName:
          type: string
        countryId:
          type: integer
          format: int64
        countryCode:
          type: string
        countryName:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        wikiDataId:
          type: string
        index:
          description: positional index
          type: integer
          format: int64
    DashaGetReqeust:
      type: object
      properties:
        uuid:
          description: uuid of the user
          type: string
        level:
          type: integer
          format: int32
    DashaGetResponse:
      type: object
      properties:
        userUuid:
          description: uuid of the user
          type: string
        dashaSystem:
          $ref: '#/components/schemas/DashaSystem'
    DashaItem:
      $ref: '#/components/schemas/DashaItem'
      type: object
      properties:
        name:
          type: string
        level:
          description: denotes the level of recursion
          type: integer
          format: int32
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        dashas:
          type: array
          items:
            $ref: '#/components/schemas/DashaItem'
    DashaMeta:
      type: object
      properties:
        name:
          type: string
        yearInSeconds:
          description: in seconds
          type: integer
          format: int64
        durationYears:
          description: in the same units as the sub dasha duration ratios
          type: integer
          format: int64
        startDasa:
          type: integer
          format: int32
        dasaDegrees:
          type: number
          format: double
        startTime:
          type: string
          format: date-time
        SubDashaMetas:
          type: array
          items:
            $ref: '#/components/schemas/SubDashaMeta'
        type:
          $ref: '#/components/schemas/DashaMeta.Types'
    DashaMeta.Types:
      type: string
      enum:
        - Ignore
        - Vimshottari
        - Ashtottari
    DashaSystem:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/DashaMeta'
        dashas:
          type: array
          items:
            $ref: '#/components/schemas/DashaItem'
    DashaUpdateReqeust:
      type: object
      properties:
        uuid:
          description: uuid of the user whose dasha should be updated
          type: string
    DashaUpdateResponse:
      type: object
      properties:
        uuid:
          description: uuid of the user whose dasha should be updated
          type: string
    EphimerisRequest:
      type: object
      properties:
        birthData:
          $ref: '#/components/schemas/BirthData'
    EphimerisResponse:
      type: object
      properties:
        output:
          type: string
    GeoLocation:
      type: object
      properties:
