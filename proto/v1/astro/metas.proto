  }
  StarThithiWeekdayYogaTypes yoga = 1;
  AstroMetas.Nature nature = 2;
  string desc = 3;
}

// Generic Yoga
// Yogas can be tied to transit events
// Yogas can be of different types like star vaar yoga, star tithi vaar yoga etc
message YogaIdentifier {
  enum YogaTypes {
    IgnoreYogaTypes = 0;
    StarWeekdayYoga = 1;
    StarThithiWeekdayYoga = 2;
  }
  YogaTypes type = 1; // to overload the Yoga identifier, this can be used for
                      // different yogas
  oneof yoga {
    StarWeekdayYoga yogaStarWeekday = 2;
    StarThithiWeekdayYoga yogaStarThithiWeekday = 3;
  }
}
