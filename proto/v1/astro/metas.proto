syntax = "proto3";
package astro;

option go_package = "github.com/dronasys-com/astro/gen/go/v1/astro";

import "google/protobuf/timestamp.proto";

message TobData {

  int32 d = 1;
  int32 m = 2;
  int32 y = 3;

  int32 hour = 4;
  int32 min = 5;
  int32 sec = 6;
  string zone = 7;
  string dateString = 11;
  google.protobuf.Timestamp tobtime = 12;
}

message PobData {
  string city = 1;    // City of Birth
  string state = 2;   // State of Birth
  string country = 3; // Country of Birth
  float lat = 11;     // Latitude of POB
  float long = 12;    // Longitude of POB
  string planet =
      13; // planet - earth, tosovo, buvalok, swargalok, patala, atala, vitala
  string yuga = 14; // varsha, yuga, treated as space variable
}

message BirthData {
  TobData tob = 1; // Date of birth
  PobData pob = 2; // Place of Birth
}

message GeoLocation {
  float lat = 1;  // Latitude of POB
  float long = 2; // Longitude of POB
}

