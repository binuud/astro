message AstroMetadata {
    string uid = 1;           // UUID for the object
    string name = 2;         // name of the object
    string owner = 3;       // owner UUID of the object (user UUID)
    string tenancy = 4;    // tenant UUID of the object
    string parentUid = 5; // parent uuid

    AstroMetas.AstroTypes type = 11;          // type of the astro object 
    repeated AstroMetas.MetaTags tags = 12;  // tags to identify/describe the object


    map<string, string> labels = 51;
    map<string, string> annotations = 52;
    string description = 53;
    
    google.protobuf.Timestamp createdAt = 101;
    google.protobuf.Timestamp updatedAt = 102;
}