syntax = "proto3";
package astro;

import "astro/metas.proto";

option go_package = "./go";


message EphimerisRequest {
	BirthData birthData  = 1;
}

message EphimerisResponse {
	string output = 1;
}



service Ephimeris {
    rpc GetChart(EphimerisRequest) returns (EphimerisResponse) {}  // get ephimeris data
	rpc GetMoonEphimeris(EphimerisRequest) returns (EphimerisResponse) {}  // get ephimeris data
	rpc GetPanchangMonth(EphimerisRequest) returns (EphimerisResponse) {}  // get ephimeris data
}