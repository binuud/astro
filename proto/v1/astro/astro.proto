syntax = "proto3";
package astro;

import "google/protobuf/timestamp.proto";
import "astro/metas.proto";

option go_package = "./go";


message Metadata {
    
    string uid = 1;           // UUID for the object
    string name = 2;         // name of the object
    string owner = 3;       // owner UUID of the object (user UUID)
    string tenancy = 4;    // tenant UUID of the object
    string parentUid = 5; // parent uuid

    bool dataEncryption = 21;
    map<string, string> labels = 51;
    map<string, string> annotations = 52;
    
    google.protobuf.Timestamp createdAt = 101;
    google.protobuf.Timestamp updatedAt = 102;
}


message PlanetDetails {
    string name = 1;
    
    double longitude = 2;
    double latitude = 3;
    double declination = 4;
    double speed = 5;
    double distance = 6;

    
    int64 star = 21;
    int64 paada = 22;
    int64 rasi = 23;
    int64 bhava = 24;
    int64 bhava_h = 25;

    bool exalted = 51;
    bool deblited = 52;
    bool ownHouse = 53;
    bool friendHouse = 54;
    bool enemyHouse = 55;
    bool moolTrikona = 56;

    int64 amsa2 = 1002;
    int64 amsa9 = 1009;
    int64 amsa10 = 1010;
    int64 amsa27 = 1027;
    int64 amsa60 = 1060;
}

message Planets {
    string ephimeris = 1;
    map<string, PlanetDetails> planetsMap = 2; 
}

message AstroObject {
    Metadata metadata = 1;
    BirthData birthData = 2;
    Planets planets = 4;
}

service Astro {
    rpc Update(UserUpdateRequest) returns (UserUpdateResponse) {} 
    rpc Get(UserGetRequest) returns (UserGetResponse) {} 
    rpc List(UserListRequest) returns (UserListResponse) {}
}


message UserUpdateRequest {
    string uuid = 1;
    BirthData birthData = 2;
}

message UserUpdateResponse {
    AstroObject astro = 1;
}

message UserGetRequest {
    string uuid = 1;
}

message UserGetResponse {
    AstroObject astro = 1;
}

message UserListRequest {
    string uuid = 1;
}

message UserListResponse {
    repeated AstroObject astro = 1;
}
